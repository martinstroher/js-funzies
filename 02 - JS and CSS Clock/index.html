<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>


  <style>
    html {
      background: #ffffff url(background.jpg) center no-repeat;
      background-size: auto;
      font-family: 'helvetica neue'; */
      font-size: 10px;
      background-position: center;
    }

    body {
      margin: 0;
      font-size: 2rem;
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
    }

    .clock {
      width: 30rem;
      height: 30rem;
      border: 0px solid white;
      border-radius: 50%;
      margin: 50px auto;
      position: relative;
      padding: 2rem;
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateY(-3px); account for the height of the clock hands
    }

    .hand {
      width: 30%;
      height: 6px;
      background: black;
      position: absolute;
      top: 50%;
      transform-origin: 100%;
      right: 50%;
      left: initial;
      rotate: 90deg;
      margin-top: -3px;
      transition: all 0.05s;
      transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
      box-shadow: 4px 4px 7px rgba(0, 0, 0, 0.7);
    }

    .second-hand {
      height: 2px;
    }

    .hour-hand {
      width: 20%;
    }

  </style>

  <script src="app.js" defer></script>
</body>
</html>
